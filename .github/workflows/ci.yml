name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kyb
          POSTGRES_PASSWORD: kyb
          POSTGRES_DB: kyb
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kyb -d kyb"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright
      - run: uv run pytest
        env:
          KYB_TEST_DATABASE_URL: postgresql://kyb:kyb@localhost:5432/kyb

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: kyb-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test /healthz and an MCP initialize
        run: |
          docker run -d --rm -p 8000:8000 -e KYB_ALLOWED_HOSTS=localhost --name kyb kyb-mcp:ci
          for i in $(seq 1 20); do curl -fsS http://localhost:8000/healthz && break || sleep 1; done
          curl -fsS -X POST http://localhost:8000/mcp \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | grep -q '"serverInfo"'
          docker stop kyb
